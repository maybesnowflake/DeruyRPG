# DeruyRPG 공통 설정

fever:
  # 게이지 최대치 (가득 차야 F 궁극기 사용). 게임 안에서 /rpg fevercfg 로도 변경 가능
  max: 100.0
  # 평타(근접·화살)로 때릴 때 증가량
  gain-on-hit: 5.0
  # 스킬 피해 1회당 증가량 (다단히트·광역은 맞을 때마다)
  gain-on-skill-hit: 5.0
  # 스킬 피해로 게이지가 오르는 최소 간격(틱, 20틱=1초). 0 = 제한 없음
  skill-gain-interval-ticks: 0
  # 피격 시 게이지 증가량
  gain-on-hurt: 2.0
  # 피버 중 공통 스킬 쿨다운 배율 (1.0 = 변화 없음, 무기별 피버 효과는 각 무기에서)
  cooldown-multiplier: 1.0

mana:
  # 초당 마나 회복 (1.0 = 가득)
  regen-per-second: 0.05

# 피버(궁극기 후) 기본 지속시간은 무기 코드 기본 15초

# 던전 보스
boss:
  moss-warden:
    # 1페이즈 최대 체력 (50%가 되면 각성 → 2페이즈 최대 체력으로 가득 채워 다시 시작)
    health: 200.0
    # 2페이즈 최대 체력 = health × 이 값
    phase2-health-multiplier: 1.5
    # 방어력 (바닐라 갑옷 수치, 0~30) — 평타·투사체·일반 스킬 피해 감소. 관통(워든 음파 등)·마법 피해는 방어력 무시
    armor: 10.0
    # 방어 강도 (0~20) — 철퇴 낙하 같은 큰 한 방이 방어력을 덜 뚫게 함
    armor-toughness: 4.0
    # 보스가 주는 모든 피해 배율
    damage-multiplier: 1.0
    # 보스방 좌표 — 게임 안에서 /rpg boss setspawn 으로 저장 (보스는 저장한 사람이 바라보던 방향을 봄)
    # spawn:
    #   world: world
    #   x: 0.5
    #   y: 64.0
    #   z: 0.5
    #   yaw: 0.0
